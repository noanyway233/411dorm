<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>这是怎么来的 - 411寝室</title>
    <link rel="icon" href="icon.ico" type="image/x-icon">
    
    <style>
        html {
            scroll-behavior: smooth; 
        }

        body {
            background-image: url('background.png'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            color: #333333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .page-wrapper {
            display: flex;
            max-width: 1100px;
            width: 100%;
            gap: 20px;
        }

        .sidebar {
            background-color: rgba(255, 255, 255, 0.85);
            padding: 30px 20px;
            border-radius: 15px;
            width: 200px;
            flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            height: fit-content;
            position: sticky;
            top: 40px;
        }

        .sidebar a {
            display: block;
            font-size: 1.2em;
            font-weight: bold;
            color: #333333;
            text-decoration: none;
            padding: 15px 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: background-color 0.3s, color 0.3s;
        }

        .sidebar a:hover {
            background-color: #e0e0e0;
            color: #000000;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.85); 
            padding: 40px 50px;
            border-radius: 15px; 
            flex-grow: 1;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 50vh; 
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            color: #666666;
            font-size: 2em;
            margin: 0 0 10px 0;
            font-weight: normal;
        }

        .header a {
            text-decoration: none;
            color: inherit;
            transition: color 0.3s;
        }

        .header a:hover {
            color: #333333;
            text-decoration: underline;
        }

        .header .date {
            color: #999999;
            font-size: 1em;
        }

        .section-title {
            font-size: 2.5em;
            font-weight: bold;
            margin-top: 30px;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .content p {
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .scroll-animate {
            opacity: 0;
            transform: translateY(50px);
            transition: all 1s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .scroll-animate.active {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="page-wrapper">
        
        <div class="sidebar">
            <a href="index.html">主 页</a>
            <a href="story.html">这是怎么来的</a>
            <a href="board.html">写点什么吧</a>
        </div>

        <div class="container">
            <div class="header">
                <h1>
                    <a href="https://www.ccw.site/detail/6af8655ae45b284a7a2a5c97?inviteCode=MWbwkgkrnuS5N0t3" title="概念版">这是怎么来的</a>
                </h1>
                <div class="date">发表于 2026-11-14</div>
            </div>

            <div class="section scroll-animate">
                <div class="section-title">这是怎么来的:</div>
                <div class="content">
                    <p>这个网站是一位朋友让我做的,为了满足他的"猎奇心理",于是这个网站就诞生了(deepseek编写)</p>
                </div>
            </div>
        </div>

    </div>

    <script>
        const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                }
            });
        }, {
            threshold: 0.1
        });

        document.querySelectorAll('.scroll-animate').forEach((el) => {
            observer.observe(el);
        });
    </script>
</body>
</html>
